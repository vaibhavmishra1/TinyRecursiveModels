name: recursive_reasoning.gram@GenerativeRecursiveReasoningModel_ACTV1
loss:
  name: losses@GRAMLossHead
  loss_type: stablemax_cross_entropy
  deep_supervision_steps: 16
  beta: 0.1
  kl_balance: 0.8
  act_loss_weight: 1.0
  lprm_loss_weight: 1.0

# GRAM paper defaults. Task train scripts override K_steps/beta/puzzle embeddings.
T_steps: 3
K_steps: 4
N_sup: 16

H_layers: 2
L_layers: 2
hidden_size: 512
num_heads: 8
expansion: 1

puzzle_emb_ndim: 0
puzzle_emb_len: 16
pos_encodings: rope
forward_dtype: bfloat16
mlp_t: False
decoder_swiglu: True

halt_max_steps: 16
halt_exploration_prob: 0.0

min_log_std: -10.0
max_log_std: 2.0
posterior_target_conditioning: add
